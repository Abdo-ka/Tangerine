name: Feature request
description: Propose a focused improvement.
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Desired behavior and example
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: How could we verify it?

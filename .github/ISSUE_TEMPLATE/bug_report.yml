name: Bug report
description: Report a reproducible problem with a non-sensitive example.
body:
  - type: markdown
    attributes:
      value: Please do not attach private files, credentials or personal paths. Follow SECURITY.md for vulnerabilities.
  - type: input
    id: environment
    attributes:
      label: macOS version, Mac architecture, app version or commit
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include input format, operation, options and target format.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Non-sensitive fixture, screenshot or error
      description: Use generated or redistributable files only.
